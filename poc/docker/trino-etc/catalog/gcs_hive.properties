# =============================================================================
# gcs_hive catalog — Hive connector over GCS Parquet/CSV files
# Used for --mode gcs benchmarks and GCS testing suite (GQ01-GQ10).
# GCS is accessed via the S3-compatible HMAC API.
# Credentials are injected at container start via Docker environment variables
# and referenced here using Trino's ${ENV:VAR} substitution syntax.
# =============================================================================

connector.name=hive

# Separate file metastore from local_hive to avoid catalog collision
hive.metastore=file
hive.metastore.catalog.dir=/opt1/olap_poc/trino/gcs_metastore

# Allow external tables and DROP TABLE
hive.non-managed-table-writes-enabled=true
hive.allow-drop-table=true

# GCS via S3-compatible API
# The install script writes actual values here, replacing ${ENV:...} tokens.
hive.s3.endpoint=${ENV:GCS_S3_ENDPOINT}
hive.s3.aws-access-key=${ENV:GCS_HMAC_ACCESS_KEY}
hive.s3.aws-secret-key=${ENV:GCS_HMAC_SECRET}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=true
hive.s3.connect-timeout=30s
hive.s3.socket-timeout=60s
hive.s3.max-error-retries=5

# Enable recursive reads
hive.recursive-directories=true
