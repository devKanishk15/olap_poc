# =============================================================================
# gcs_hive catalog — Hive connector over GCS Parquet/CSV files
# Used for --mode gcs benchmarks and GCS testing suite (GQ01-GQ10).
# GCS is accessed via the S3-compatible HMAC API using the native S3 file system
# (hive.s3.* was removed in Trino 435+; use fs.native-s3.* instead).
# Credentials are substituted by the install script via sed.
# =============================================================================

connector.name=hive

# Separate file metastore from local_hive to avoid catalog collision
hive.metastore=file
hive.metastore.catalog.dir=/opt1/olap_poc/trino/gcs_metastore

# Native S3 file system (replaces legacy hive.s3.* removed in Trino 435+)
# GCS exposes an S3-compatible API at storage.googleapis.com
fs.s3.enabled=true
s3.endpoint=${ENV:GCS_S3_ENDPOINT}
s3.aws-access-key=${ENV:GCS_HMAC_ACCESS_KEY}
s3.aws-secret-key=${ENV:GCS_HMAC_SECRET}
s3.path-style-access=true
s3.region=us-east-1

# Default storage format and recursive reads
hive.storage-format=PARQUET
hive.recursive-directories=true
