# =============================================================================
# local_hive catalog — Hive connector over local Parquet files
# Used for --mode local benchmarks.
# External tables point to file:///opt1/olap_poc/data/ (host path, bind-mounted
# read-only into the container at the same path).
# =============================================================================

connector.name=hive

# File-based metastore: stores table/partition metadata in local JSON files.
# No external HMS service required.
hive.metastore=file
hive.metastore.catalog.dir=/data/trino/metastore

# Default storage format for managed tables (not used for external tables)
hive.storage-format=PARQUET

# Enable recursive Parquet reads (for hive-partitioned directory layouts)
hive.recursive-directories=true
