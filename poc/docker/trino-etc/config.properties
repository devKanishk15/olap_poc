# =============================================================================
# Trino coordinator + worker config (single-node deployment)
# =============================================================================

coordinator=true
node-scheduler.include-coordinator=true

http-server.http.port=8080

# Discovery URI must match the port above
discovery.uri=http://localhost:8080

# ---------------------------------------------------------------------------
# Memory limits  (VM has 8 GB; JVM gets 6 GB via -Xmx in jvm.config)
# ---------------------------------------------------------------------------
query.max-memory=5GB
query.max-memory-per-node=5GB
query.max-total-memory-per-node=6GB

# ---------------------------------------------------------------------------
# Parallelism (4 vCPU VM)
# ---------------------------------------------------------------------------
task.concurrency=4
task.max-worker-threads=8
query.initial-hash-partitions=4

# ---------------------------------------------------------------------------
# Spill configuration
# ---------------------------------------------------------------------------
spill-enabled=true
spiller-spill-path=/data/trino/spill
spill-order-by=true
spill-aggregation=true

# ---------------------------------------------------------------------------
# Query timeouts
# ---------------------------------------------------------------------------
query.max-execution-time=10m
query.max-run-time=10m
