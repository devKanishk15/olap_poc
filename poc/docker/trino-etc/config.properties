# =============================================================================
# Trino coordinator + worker config (single-node deployment, Trino 481)
# =============================================================================

coordinator=true
node-scheduler.include-coordinator=true

http-server.http.port=8080

# Discovery URI must match the port above
discovery.uri=http://localhost:8080

# ---------------------------------------------------------------------------
# Memory limits  (VM has 8 GB; JVM gets 6 GB via -Xmx in jvm.config)
# query.max-memory-per-node and query.max-total-memory-per-node were removed;
# use cluster-level query.max-memory and query.max-total-memory instead.
# ---------------------------------------------------------------------------
query.max-memory=5GB
query.max-total-memory=6GB

# ---------------------------------------------------------------------------
# Query timeouts
# ---------------------------------------------------------------------------
query.max-execution-time=10m
query.max-run-time=10m
